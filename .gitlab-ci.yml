# GitLab CI for genworks/demos: one job, a COLD LOAD of the demos.
#
# Every push starts the web server and then loads demos-common and
# every demo system through Quicklisp on the published free Gendl
# image, genworks/gendl:devo-ccl, an image that has never seen this
# repo -- what a stack host's services-init does (ci/cold-load.lisp,
# which also lists the systems the free image cannot load and why).
# Any error and any warning signalled while a system loads fails the
# job.  A warm development image, where the packages already exist,
# cannot catch a file that sorts ahead of package.lisp or a dependency
# nobody declared; that is how every production demo went dark on
# 2026-09-11, and this is the check that would have caught it.
#
# Nothing is built, pushed or deployed here: demos reach the stack
# hosts through the repos deploy script, not through CI.  A pull-only
# job needs no Docker Hub credentials.
#
# Runner: the amd64 DOCKER executor (tag "amd64-docker", on balaram
# beside the shell runner that carries plain "amd64"): the job runs
# inside the Gendl image itself, as the image's own user, with the
# checkout at $CI_PROJECT_DIR.  This is also the standing proof that
# the published Gendl images work as CI images under a docker
# executor.  It never goes through the legacy build manager the
# gendl/gdl pipelines drive.  The 2023 configuration this replaced
# wanted runners tagged demos+website that no longer exist, so no
# pipeline had started since 2023-12-08.

stages:
  - load

cold-load:
  stage: load
  image: genworks/gendl:devo-ccl
  tags:
    - amd64-docker
  variables:
    GIT_DEPTH: "1"
  script:
    # A private copy of the checkout: register-local-projects writes
    # system-index.txt beside the .asd files, and the build directory
    # belongs to the runner's helper rather than the image's user.
    - rm -rf /tmp/demos && cp -r "$CI_PROJECT_DIR" /tmp/demos
    - cd /opt/gendl
    - DEMOS_DIR=/tmp/demos ./gdl/program/gdl-ccl -n -b --load /tmp/demos/ci/cold-load.lisp
