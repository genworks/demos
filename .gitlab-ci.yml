# GitLab CI for genworks/demos: a COLD LOAD of the demos and a SMOKE
# RUN through them, on each engine.
#
# Every push starts the web server and then loads demos-common and
# every demo system through Quicklisp on the published free Gendl
# image, genworks/gendl:devo-ccl, an image that has never seen this
# repo -- what a stack host's services-init does (ci/cold-load.lisp,
# which also lists the systems the free image cannot load and why).
# Any error and any warning signalled while a system loads fails the
# job.  A warm development image, where the packages already exist,
# cannot catch a file that sorts ahead of package.lisp or a dependency
# nobody declared; that is how every production demo went dark on
# 2026-09-11, and this is the check that would have caught it.  Then
# every demo that loaded is published and its page fetched from the
# image's own server, and the prompt lab is driven through its doors
# (a session, a hand-written model compiled and loaded, its tools
# called over MCP, the viewer drawing it) with no agent and no
# network; any failed page fails the
# job.  The header of ci/cold-load.lisp has the details.
#
# The same script runs twice, once per engine: cold-load on the free
# Gendl image (CCL), cold-load-gdl on Genworks GDL (Allegro), where
# gear and naca-nurbs, which need its surfaces and solids, load and
# are smoked too.
#
# Nothing is built, pushed or deployed here: demos reach the stack
# hosts through the repos deploy script, not through CI.
#
# Runner for cold-load: the amd64 DOCKER executor (tag "amd64-docker", beside the
# shell runner that carries plain "amd64"): the job runs
# inside the Gendl image itself, as the image's own user, with the
# checkout at $CI_PROJECT_DIR.  This is also the standing proof that
# the published Gendl images work as CI images under a docker
# executor.  It never goes through the legacy build manager the
# gendl/gdl pipelines drive.  The 2023 configuration this replaced
# wanted runners tagged demos+website that no longer exist, so no
# pipeline had started since 2023-12-08.

stages:
  - load

# The prompt lab depends on Monocle, which has a repository of its own.
# Each job fetches its source as an archive (the images carry curl and
# tar, not git) and names the directory to ci/cold-load.lisp.
variables:
  MONOCLE_ARCHIVE: "https://gitlab.common-lisp.net/monocle/monocle/-/archive/master/monocle-master.tar.gz"

cold-load:
  stage: load
  image: genworks/gendl:devo-ccl
  tags:
    - amd64-docker
  variables:
    GIT_DEPTH: "1"
  script:
    # A private copy of the checkout: register-local-projects writes
    # system-index.txt beside the .asd files, and the build directory
    # belongs to the runner's helper rather than the image's user.
    - rm -rf /tmp/demos && cp -r "$CI_PROJECT_DIR" /tmp/demos
    - rm -rf /tmp/monocle && mkdir /tmp/monocle
    - curl -fsSL "$MONOCLE_ARCHIVE" | tar xz --strip-components=1 -C /tmp/monocle
    - cd /opt/gendl
    - MONOCLE_DIR=/tmp/monocle DEMOS_DIR=/tmp/demos ./gdl/program/gdl-ccl -n -b --load /tmp/demos/ci/cold-load.lisp

# Genworks GDL: the rolling betatest image, which is private, so this
# job runs on the amd64 SHELL runner, whose own Docker login pulls it,
# and starts the image by hand -- the arrangement of the gdl pipeline's
# quick-test.  The checkout is mounted read-only and copied inside.  A
# hung run leaves its container behind (--rm acts only on exit), so the
# name is cleared first and the run is capped.  Interim: a long-running
# CI ship is to take this over.
cold-load-gdl:
  stage: load
  tags:
    - amd64
  variables:
    GIT_DEPTH: "1"
    GDL_IMAGE: genworks/gdl:devo-non-smp-betatest
  script:
    - docker pull "$GDL_IMAGE"
    - docker rm -f demos-cold-load-gdl >/dev/null 2>&1 || true
    - rm -rf "$CI_PROJECT_DIR.monocle" && mkdir "$CI_PROJECT_DIR.monocle"
    - curl -fsSL "$MONOCLE_ARCHIVE" | tar xz --strip-components=1 -C "$CI_PROJECT_DIR.monocle"
    - >
      timeout 1500 docker run --rm --name demos-cold-load-gdl
      -v "$CI_PROJECT_DIR":/src:ro -v "$CI_PROJECT_DIR.monocle":/monocle-src:ro --entrypoint bash "$GDL_IMAGE"
      -c 'cp -r /src /tmp/demos && cp -r /monocle-src /tmp/monocle && cd /opt/genworks-gdl && MONOCLE_DIR=/tmp/monocle DEMOS_DIR=/tmp/demos ./gdl/program/gdl -batch -L /tmp/demos/ci/cold-load.lisp'
      || { status=$?; docker rm -f demos-cold-load-gdl >/dev/null 2>&1 || true; exit $status; }
