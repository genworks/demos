# GitLab CI for genworks/demos: one job, a COLD LOAD of the demos.
#
# Every push starts the web server and then loads demos-common and
# every demo system through Quicklisp on the published free Gendl
# image, genworks/gendl:devo-ccl, an image that has never seen this
# repo -- what a stack host's services-init does (ci/cold-load.lisp,
# which also lists the systems the free image cannot load and why).
# Any error and any warning signalled while a system loads fails the
# job.  A warm development image, where the packages already exist,
# cannot catch a file that sorts ahead of package.lisp or a dependency
# nobody declared; that is how every production demo went dark on
# 2026-09-11, and this is the check that would have caught it.
#
# Nothing is built, pushed or deployed here: demos reach the stack
# hosts through the repos deploy script, not through CI.  A pull-only
# job needs no Docker Hub credentials.
#
# Runner: the amd64 instance runner (tag "amd64") is balaram's SHELL
# executor, the leg the gornskew repos build on; there is no amd64
# docker executor, so an `image:` keyword would be ignored (pipeline
# 3737).  The job therefore runs the image itself with docker, the
# checkout streamed in as a tar so no bind mount and no file ownership
# is involved, and the container gets no network.  It never goes
# through the legacy build manager the gendl/gdl pipelines drive.  The
# 2023 configuration this replaced wanted runners tagged demos+website
# that no longer exist, so no pipeline had started since 2023-12-08.

stages:
  - load

cold-load:
  stage: load
  tags:
    - amd64
  variables:
    GIT_DEPTH: "1"
    IMAGE: genworks/gendl:devo-ccl
  script:
    - docker pull -q "$IMAGE"
    - tar -C "$CI_PROJECT_DIR" -cf - . | docker run -i --rm --network none "$IMAGE" bash -c 'mkdir -p /tmp/demos && tar -C /tmp/demos -xf - && cd /opt/gendl && DEMOS_DIR=/tmp/demos ./gdl/program/gdl-ccl -n -b --load /tmp/demos/ci/cold-load.lisp </dev/null'
